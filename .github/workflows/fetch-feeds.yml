name: Publish redirect

# Dalal Street Wire moved to https://github.com/nyamalagame/global-affairs-wire
# (the Dalal Street tab). This site now only redirects there, so there is no
# schedule and no news fetching here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the redirect page
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
