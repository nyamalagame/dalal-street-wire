name: Fetch feeds and publish

# Fetches every feed on GitHub's servers and publishes the dashboard plus a
# fresh data/feeds.json straight to GitHub Pages. Nothing is committed to the
# repository, so its history only holds the code.
# Requires Settings > Pages > Source set to "GitHub Actions".

# Runs only when asked: no schedule.
on:
  workflow_dispatch:          # run it by hand: Actions tab > Fetch feeds and publish > Run workflow
  push:
    branches: [main]          # republish whenever the dashboard or script changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feedparser
        run: pip install feedparser==6.0.11

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          python scripts/fetch_feeds.py _site/data/feeds.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
